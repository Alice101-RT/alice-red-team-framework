add_newline = true
command_timeout = 1000

format = """
[╭─](bold #F096B2)$username[](fg:#F096B2 bg:#1a1026)$hostname[](fg:#1a1026 bg:#A5CFD5)$directory[](fg:#A5CFD5 bg:#0b0b12)$git_branch$git_status$python$cmd_duration
[╰─](bold #F096B2)[❯](bold #F096B2)[❯](bold #C6B3E6)[❯](bold #A5CFD5) """

[username]
show_always = true
style_user = "bg:#F096B2 fg:#0b0b12 bold"
style_root = "bg:#ff004c fg:#0b0b12 bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:#1a1026 fg:#E99EBB bold"
format = "[ @$hostname ]($style)"

[directory]
style = "bg:#A5CFD5 fg:#0b0b12 bold"
truncation_length = 3
truncate_to_repo = false
format = "[ $path ]($style)"

[git_branch]
symbol = " "
style = "bold #fcee09"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bold #F096B2"
format = "[$all_status$ahead_behind ]($style)"

[python]
symbol = " "
style = "bold #05ffa1"
format = "[ $symbol$version ]($style)"

[cmd_duration]
min_time = 1000
style = "bold #f8f8f2"
format = "[ took $duration ]($style)"
