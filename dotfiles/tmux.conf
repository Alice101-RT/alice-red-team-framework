# =========================
# Alice Arch - tmux config
# =========================

# Use Ctrl-a instead of Ctrl-b as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Bigger history
set -g history-limit 50000

# Better colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Split panes using intuitive keys
bind | split-window -h
bind - split-window -v

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
set -g status on
set -g status-position top
set -g status-interval 2

set -g status-style bg=#0b0b12,fg=#ffd6f6
set -g message-style bg=#ff2a6d,fg=#0b0b12
set -g pane-border-style fg=#3b3b4f
set -g pane-active-border-style fg=#ff2a6d

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style bg=#0b0b12,fg=#b967ff
set -g window-status-current-style bg=#ff2a6d,fg=#0b0b12,bold

set -g status-left-length 40
set -g status-left "#[bg=#ff2a6d,fg=#0b0b12,bold] alice #[bg=#1a1026,fg=#ff7ad9] #S "

set -g status-right-length 80
set -g status-right "#[fg=#01cdfe]%H:%M #[fg=#ff2a6d]%d/%m/%Y "
